# AICluster Default Configuration

app:
  name: AICluster
  version: 1.0.0
  environment: development
  debug: false

server:
  host: 0.0.0.0
  port: 8000
  workers: 4
  cors_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000

database:
  url: sqlite+aiosqlite:///./data/aicluster.db
  pool_size: 10
  max_overflow: 20

auth:
  secret_key: aicluster-secret-key-change-in-production
  algorithm: HS256
  access_token_expire_minutes: 60
  bcrypt_rounds: 12

workers:
  max_workers: 100
  heartbeat_timeout: 30
  default_cpu_limit: 25
  default_ram_limit_gb: 8
  auto_pause: true
  auto_resume: true

scheduler:
  max_queued_jobs: 1000
  default_retries: 3
  poll_interval: 2
  job_timeout: 3600

monitoring:
  cpu_warning_threshold: 80
  ram_warning_threshold: 85
  disk_warning_threshold: 90
  temperature_warning: 80

logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  max_file_size: 10485760
  backup_count: 5
