[package]
name = "studio"
version = "2.0.0"
description = "AICluster Studio - Application Lifecycle Manager & Desktop IDE"
authors = ["AICluster"]
edition = "2021"
rust-version = "1.70"

[[bin]]
name = "AIClusterStudio"
path = "src/main.rs"

[lib]
name = "studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
once_cell = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
] }
hostname = "0.4"
